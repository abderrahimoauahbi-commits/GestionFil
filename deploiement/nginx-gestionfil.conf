# =============================================================================
# Gestion Fil — terminaison TLS
# -----------------------------------------------------------------------------
# Destination : /etc/nginx/sites-available/gestionfil, lie depuis sites-enabled.
#
# nginx est le SEUL service expose au reseau. L'application ecoute sur
# 127.0.0.1:8080 et ne recoit que ce qui passe par ici ; PostgreSQL n'a jamais
# ecoute ailleurs que sur la boucle locale.
#
# CE FICHIER N'EXISTAIT QUE SUR LE SERVEUR, et cela s'est paye cher — voir plus
# bas. Il est desormais versionne : ce qui tient l'acces de toute l'entreprise
# se relit, se compare et se restaure comme le reste du code.
# =============================================================================

# LIMITATION DE DEBIT (audit C4, 17/10/2026).
#
# L'application freinait deja les essais de mot de passe (`TropDeTentatives`),
# mais rien ne freinait le reste de l'API — or le nom public ci-dessous rend le
# serveur joignable depuis Internet. Deux zones, par adresse cliente :
#
#   gestionfil_api        tout /api/ : 50 requetes/s, rafale de 100. Un ecran
#                         qui s'ouvre en lance une vingtaine ; meme vingt postes
#                         derriere une seule adresse (le nom public vu du reseau
#                         interne) restent loin du plafond. Une boucle, non.
#   gestionfil_connexion  /api/auth/connexion : 20 par minute, rafale de 20. Le
#                         hachage d'un mot de passe coute une seconde de
#                         processeur : sans ce frein, marteler la connexion
#                         suffirait a saturer le serveur. Vingt, pour qu'une
#                         releve d'equipe se connecte d'un coup sans etre bloquee.
#
# PAS SUR `/` : l'application installable precharge 164 fichiers a la premiere
# visite. Limites, ils tomberaient en 429 et l'installation echouerait.
#
# Ces directives sont au niveau `http` : ce fichier est inclus dans le bloc http
# de nginx.conf (sites-enabled/*), hors de tout bloc `server`.
limit_req_zone $binary_remote_addr zone=gestionfil_api:10m       rate=50r/s;
limit_req_zone $binary_remote_addr zone=gestionfil_connexion:10m rate=20r/m;
limit_req_status 429;

server {
    # `default_server` : VOIR LE BLOC 443 CI-DESSOUS, MEME RAISON. Sans lui,
    # /ca.crt — le certificat que les tablettes et les telephones doivent
    # telecharger pour reconnaitre le serveur — part chez le premier site venu,
    # qui repond 404.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # LE CERTIFICAT RACINE, SERVI EN CLAIR, ET C'EST VOULU.
    # Un iPad ou un telephone ne sait pas installer un fichier venu d'ailleurs :
    # il faut pouvoir l'ouvrir depuis le navigateur. Un certificat public n'est
    # pas un secret — c'est meme sa raison d'etre.
    location = /ca.crt {
        alias /var/www/gestionfil/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    # `default_server` EST LA POUR UNE PANNE REELLE, LE 18/09/2026.
    #
    # Tout le monde ici tape https://192.168.1.140 — une ADRESSE, pas un nom.
    # Aucun `server_name` ne peut donc matcher : nginx confie la demande au
    # serveur PAR DEFAUT du port. A defaut de declaration explicite, ce defaut
    # est simplement LE PREMIER BLOC `listen 443` RENCONTRE — et l'ordre de
    # lecture de sites-enabled est alphabetique.
    #
    # Ce jour-la, une seconde application (« caisse-amal ») a ete installee sur
    # la meme machine. Elle avait pourtant pris soin de ne reclamer que son
    # propre nom et son propre port. Mais « caisse-amal » precede « gestionfil »
    # dans l'alphabet : son bloc 443 est devenu le defaut, et TOUTE L'ENTREPRISE
    # a vu la caisse en ouvrant l'ERP — sans qu'une seule ligne de Gestion Fil
    # ait change.
    #
    # Le commentaire d'alors disait deja « le bloc par defaut ci-dessus ». Il
    # l'etait par accident d'ordre, pas par declaration. Un mot manquait.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/gestionfil-pki/serveur.crt;
    ssl_certificate_key /etc/gestionfil-pki/serveur.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # PAS DE HSTS. Il forcerait les navigateurs a refuser tout retour au HTTP
    # pendant des mois — y compris si ce certificat devait etre abandonne. Sur
    # une adresse IP et une autorite privee, c'est un aller sans retour.

    # Les sauvegardes et les paquets se telechargent par ici.
    client_max_body_size 64m;

    # LES EN-TETES DE SECURITE (audit v5, T13) : pas de devinette du type d'un
    # fichier, pas d'affichage dans le cadre d'un autre site, pas d'adresse
    # complete transmise ailleurs. Pas de CSP ici : l'interface la porte
    # elle-meme, au plus pres de ce qu'elle charge.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    # HTTPS SEULEMENT, UN AN (audit de securite du 13/10/2026) : le navigateur
    # ne repasse plus jamais en clair sur ce nom. La politique de contenu (CSP)
    # vient de l'application elle-meme, ici comme en direct sur le poste.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # L'ASSISTANT REPOND EN MINUTES, PAS EN SECONDES. Le modele tourne sur ce
    # serveur, sans carte graphique : trois allers-retours d'outils demandent
    # une a trois minutes. Le delai general coupait la question avant la
    # reponse, et l'utilisateur lisait ce 504 comme une panne — le 22/09 a
    # 17 h 47, exactement cela. (Bloc present en production, perdu par la
    # version du 09/10 et retabli le 10/10/2026 avant de la publier.)
    location /api/chat {
        limit_req zone=gestionfil_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /api/auth/connexion {
        limit_req zone=gestionfil_connexion burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=gestionfil_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AU-DELA DU DELAI DE L'APPLICATION (300 s, GESTIONFIL_DELAI_HTTP_S) :
        # a 120 s, nginx coupait un calcul de plan que l'application menait
        # encore, et l'ecran recevait un 504 muet au lieu de son message.
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
}

# LE NOM, AVEC SON CERTIFICAT PUBLIC.
#
# Le bloc par defaut ci-dessus sert l'ADRESSE IP avec l'autorite interne : un
# poste qui tape encore https://192.168.1.140 ne doit pas se voir refuser. Ce
# bloc-ci sert le NOM, avec un certificat reconnu par tous les appareils — sans
# quoi les telephones refusent d'installer l'application.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp-polyfashions.dedyn.io;

    ssl_certificate     /etc/gestionfil-pki/public/serveur.crt;
    ssl_certificate_key /etc/gestionfil-pki/public/serveur.key;

    client_max_body_size 64m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    # HTTPS SEULEMENT, UN AN (audit de securite du 13/10/2026) : le navigateur
    # ne repasse plus jamais en clair sur ce nom. La politique de contenu (CSP)
    # vient de l'application elle-meme, ici comme en direct sur le poste.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Memes freins que sur l'adresse : c'est par ce nom-ci que vient Internet.
    location = /api/auth/connexion {
        limit_req zone=gestionfil_connexion burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=gestionfil_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
}
