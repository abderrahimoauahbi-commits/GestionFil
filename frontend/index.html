<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="description" content="ERP Gestion Fil - Polyfashions Carpet Morocco" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icone-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gestion Fil" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Gestion Fil</title>

    <script>
      // Applique le theme AVANT le premier rendu : sans cela, un utilisateur en
      // mode sombre voit un eclair blanc a chaque chargement.
      (function () {
        try {
          var choix = localStorage.getItem('gestionfil.theme') || 'systeme'
          var sombre =
            choix === 'sombre' ||
            (choix === 'systeme' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (sombre) document.documentElement.classList.add('sombre')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!--
      LA LENTILLE DE LA FAMILLE « VERRE ».

      Un `backdrop-filter` ne sait flouter que de facon uniforme ; il ne sait pas
      DEFORMER. Or c'est la deformation du fond qui fait lire une surface comme
      du verre epais plutot que comme un calque translucide. Ce filtre la fournit :
      un bruit fractal de tres basse frequence deplace le fond de quelques pixels,
      lentement, sans motif reconnaissable.

      DE TRES BASSE FREQUENCE, ET C'EST LE POINT : sur un degrade lisse, un
      deplacement lent produit une ondulation de verre. Une frequence plus haute
      produirait du grain, et ce serait sale. Sur un ERP ou l'on regarde des
      chiffres huit heures par jour, `scale` reste a 18 — assez pour voir la
      matiere, trop peu pour distraire.

      Il ne s'applique QU'AU FOND, jamais au contenu : le texte et les chiffres
      poses sur la carte ne sont pas touches.

      Chromium seul sait utiliser un filtre SVG comme `backdrop-filter` (donc
      WebView2, donc l'application Tauri). Ailleurs, la feuille de style retombe
      sur un flou simple — voir palettes.css.
    -->
    <svg
      aria-hidden="true"
      focusable="false"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
    >
      <filter id="verre-lentille" color-interpolation-filters="sRGB">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.004 0.007"
          numOctaves="2"
          seed="7"
          result="ondulation"
        />
        <feGaussianBlur in="ondulation" stdDeviation="1.5" result="ondulation_douce" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="ondulation_douce"
          scale="34"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
