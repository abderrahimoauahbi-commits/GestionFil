[package]
name = "gestionfil-bureau"
version = "0.1.0"
description = "ERP Gestion Fil - application de bureau"
edition = "2021"
rust-version = "1.82"

[lib]
name = "gestionfil_bureau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Active par `tauri dev` ; laisse les outils de developpement accessibles.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
